services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animalguard
      POSTGRES_USER: animalguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animalguard}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - animalguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalguard -d animalguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  animalguard-postgres-data:
