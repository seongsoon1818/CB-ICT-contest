spring:
  datasource:
    url: jdbc:h2:mem:animalguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

animalguard:
  device-control:
    cooldown: 20s
    camera-device-mappings:
      cam-001: pi-001
      cam-002: pi-002
  risk:
    class-scores:
      MAGPIE: 25
      UNKNOWN: 0
    count-threshold: 3
    count-score: 25
    confidence-threshold: 0.90
    confidence-score: 20
    medium-threshold: 40
    high-threshold: 70
