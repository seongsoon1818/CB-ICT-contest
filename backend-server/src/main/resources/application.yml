spring:
  application:
    name: animalguard-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholder-replacement: false
    # Flyway 9+ default; keep explicit so destructive clean remains disabled by policy.
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

animalguard:
  device-control:
    cooldown: ${DEVICE_COMMAND_COOLDOWN:20s}
    camera-device-mappings: {}
  risk:
    class-scores:
      MAGPIE: 30
      UNKNOWN: 0
    count-threshold: 3
    count-score: 20
    confidence-threshold: 0.90
    confidence-score: 20
    medium-threshold: 40
    high-threshold: 70
