spring:
  application:
    name: animalguard-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/animalguard}
    username: ${DB_USERNAME:animalguard}
    password: ${DB_PASSWORD:animalguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

animalguard:
  risk:
    class-scores:
      MAGPIE: 30
      UNKNOWN: 0
    count-threshold: 3
    count-score: 20
    confidence-threshold: 0.90
    confidence-score: 20
    medium-threshold: 40
    high-threshold: 70
